name: Build iOS IPA Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - lib/**
      - ios/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/ipa-release.yml

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA artifact
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate required secrets
        shell: bash
        run: |
          for key in SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${{ secrets.SUPABASE_URL }}" ] && [ "$key" = "SUPABASE_URL" ]; then
              echo "Missing required secret: SUPABASE_URL"
              exit 1
            fi
            if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ] && [ "$key" = "SUPABASE_ANON_KEY" ]; then
              echo "Missing required secret: SUPABASE_ANON_KEY"
              exit 1
            fi
          done

      - name: Build iOS (no codesign)
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Package IPA
        shell: bash
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          (
            cd build/ios/ipa
            zip -qry TrailSync.ipa Payload
          )

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/TrailSync.ipa
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release asset
    runs-on: ubuntu-latest
    needs:
      - build-ios

    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist

      - name: Create release metadata
        id: release_meta
        shell: bash
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to Releases (IPA only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Build ${{ steps.release_meta.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: dist/TrailSync.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
